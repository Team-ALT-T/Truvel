#    restart: always
#    ports:
#      - "8080:8080"
#    env_file:
#      - .env
#    depends_on:
#      - mysql
#      - redis
#
  redis:
    container_name: redis
    image: "redis:7" # redis 버전 명시
    ports:
        - "${REDIS_PORT}:6379"
    command: ["redis-server", "--bind", "0.0.0.0", "--port", "6379"]

volumes:
  mysql-data:
