plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'alt_t'
version = '0.0.1-SNAPSHOT'

jar {
	archiveBaseName.set('truvel')
	archiveVersion.set('0.0.1-SNAPSHOT')
}



java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

jacoco {
    toolVersion = "0.8.11"
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation("io.github.cdimascio:java-dotenv:5.2.2")
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
	implementation 'io.swagger.core.v3:swagger-models:2.2.20'

	implementation 'com.fasterxml.jackson.core:jackson-databind'


	testImplementation 'com.h2database:h2'

	// Embedded redis 라이브러리
	testImplementation('com.github.codemonstur:embedded-redis:1.4.3') {
		exclude group: 'org.slf4j', module: 'slf4j-simple'
	}

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

	// JWT (jjwt 사용)
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// spring data redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// spring starter - JavaMailSender
	implementation 'org.springframework.boot:spring-boot-starter-mail'

}

test {
	useJUnitPlatform()
}

def jacocoExclude = [
        '/searchCountryAndCity/',
        'GooglePlaceClient.java'
]

jacocoTestReport {
    dependsOn test

    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, excludes: jacocoExclude)
                })
        )
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
            excludes = jacocoExclude
        }
    }
}