  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend-quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create backend .env for CI
        working-directory: backend/truvel
        env:
          CI_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CI_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CI_GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          CI_GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
        run: |
          JWT_SECRET_RAW="${CI_JWT_SECRET:-ci-jwt-secret-for-tests-please-change-this-value}"
          JWT_SECRET_B64="$(printf "%s" "$JWT_SECRET_RAW" | base64 | tr -d '\n')"
          cat <<EOF > .env
          DB_URL=jdbc:mysql://mysql:3306/truvel
          DB_NAME=truvel
          DB_USER=truvel
          DB_PASSWORD=truvel
          DB_PORT=3308
          REDIS_HOST=redis
          REDIS_PORT=6379
          GOOGLE_API_KEY=${CI_GOOGLE_API_KEY:-dummy}
          JWT_SECRET=${JWT_SECRET_B64}
          GMAIL_ADDRESS=${CI_GMAIL_ADDRESS:-dummy@example.com}
          GOOGLE_APP_PASSWORD=${CI_GOOGLE_APP_PASSWORD:-dummy-password}
          EOF

      - name: Start backend containers
        working-directory: backend/truvel
        run: docker compose up -d --build

      - name: Wait backend port
        run: |
          for i in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1; then
              echo "Backend port 8080 is open."
              exit 0
            fi
            echo "Waiting for backend port... ($i/60)"
            sleep 2
          done
          echo "Backend port timeout"
          exit 1

      - name: Wait backend app readiness
        working-directory: backend/truvel
        run: |
          for i in {1..45}; do
            RUNNING=$(docker inspect -f '{{.State.Running}}' springboot_web 2>/dev/null || echo "false")
            if [ "$RUNNING" != "true" ]; then
              echo "springboot_web container is not running."
              docker compose ps
              docker compose logs --no-color springboot_web
              exit 1
            fi

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/error || true)
            if [ "$STATUS" != "000" ] && [ "$STATUS" -lt 500 ]; then
              echo "Backend app is reachable (HTTP $STATUS)."
              exit 0
            fi

            echo "Waiting for backend app... ($i/45, status=$STATUS)"
            sleep 2
          done
          echo "Backend readiness timeout"
          docker compose logs --no-color
          exit 1

      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: |
          npm run dev &
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$STATUS" = "200" ]; then
              echo "Frontend is ready."
              exit 0
            fi
            echo "Waiting for frontend... ($i/60, status=$STATUS)"
            sleep 2
          done
          echo "Frontend readiness timeout"
          exit 1

      - name: Run E2E
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: npm run e2e -- --workers=1

      - name: Dump docker logs
        if: failure()
        working-directory: backend/truvel
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        working-directory: backend/truvel
        run: docker compose down -v

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
